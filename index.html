<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. Jain Bistro — Neighborhood Coffee Bar &amp; Roastery</title>
    <meta
      name="description"
      content="Neighborhood specialty coffee bar and small-batch roastery offering single-origin espresso, pour-overs, pastries, and direct inquiries."
    />
    <meta property="og:title" content="Mr. Jain Bistro — Neighborhood Coffee Bar &amp; Roastery" />
    <meta
      property="og:description"
      content="Neighborhood specialty coffee bar and small-batch roastery offering single-origin espresso, pour-overs, pastries, and direct inquiries."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 antialiased selection:bg-[#1C4A38]/15 selection:text-[#1C4A38]">
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="max-width:560px;margin:64px auto;padding:28px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;font-family:system-ui,sans-serif;color:#18181b;line-height:1.6">' +
          '<h1 style="margin:0 0 8px;font-size:22px;font-weight:600">Mr. Jain Bistro requires a local dev server</h1>' +
          '<p style="margin:0 0 16px;color:#52525b;font-size:14px">Chrome blocks TypeScript/ES module scripts when opening <code>index.html</code> directly via <code>file://</code>. To view the website locally:</p>' +
          '<ol style="margin:0 0 16px;padding-left:20px;font-size:14px;color:#27272a">' +
          '<li>Open a terminal in the project folder.</li>' +
          '<li>Run <code>npm install</code></li>' +
          '<li>Run <code>npm run dev</code></li>' +
          '<li>Open <code>http://localhost:3000</code> in Google Chrome.</li>' +
          '</ol>' +
          '</div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
